# Compile ElioTV sur les serveurs de GitHub (gratuit pour un projet public) :
# Windows et Android à chaque envoi, téléchargeables dans l'onglet « Actions ».
name: Compilation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ElioTV-Windows
          path: build/windows/x64/runner/Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ElioTV-Android
          path: build/app/outputs/flutter-apk/app-release.apk
